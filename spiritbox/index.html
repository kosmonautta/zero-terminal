<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SPIRITBOX</title>
<link rel="stylesheet" href="../style.css">
<style>

    .archive-entry{
        border:1px solid var(--line);
        margin-bottom:14px;
    }

    .archive-entry summary{
        list-style:none;
        cursor:pointer;
        user-select:none;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:16px;
        padding:20px 24px;
        font-family:"Courier New", monospace;
        font-size:12px;
        letter-spacing:2px;
        text-transform:uppercase;
    }

    .archive-entry summary::-webkit-details-marker{
        display:none;
    }

    .archive-entry summary::marker{
        content:"";
    }

    .entry-left{
        display:flex;
        align-items:center;
        gap:20px;
        min-width:0;
    }

    .entry-index{
        color:var(--dim);
    }

    .entry-title{
        color:var(--fg);
    }

    .entry-class{
        color:var(--dim);
    }

    .entry-right{
        display:flex;
        align-items:center;
        gap:18px;
        flex-shrink:0;
    }

    .entry-status{
        padding:4px 9px;
        border:1px solid var(--fg);
    }

    .entry-status.decoded{
        color:var(--fg);
    }

    .toggle-icon::before{
        content:"+";
    }

    .archive-entry[open] .toggle-icon::before{
        content:"–";
    }

    .archive-entry[open] summary{
        border-bottom:1px solid var(--line);
    }

    .entry-body{
        padding:28px 24px 32px 24px;
    }

    .cipher-text{
        font-family:"Courier New", monospace;
        font-size:18px;
        letter-spacing:2px;
        line-height:2;
        word-spacing:14px;
        white-space:pre-wrap;
        min-height:6.5em;
        color:var(--fg);
    }

    .cipher-text.decoded{
        color:var(--fg);
    }

    .key-row{
        display:flex;
        gap:10px;
        margin-top:28px;
    }

    .key-row input{
        font-family:"Courier New", monospace;
        letter-spacing:2px;
    }

    .key-row button{
        white-space:nowrap;
    }

    .decode-status{
        margin-top:14px;
        font-family:"Courier New", monospace;
        font-size:12px;
        letter-spacing:2px;
        text-transform:uppercase;
        color:var(--dim);
        min-height:1.4em;
    }

    .decode-status.decoded{
        color:var(--dim);
    }

    .archive-empty{
        font-family:"Courier New", monospace;
        font-size:13px;
        letter-spacing:1px;
        color:var(--dim);
        text-transform:uppercase;
    }

</style>
</head>
<body>
<main>

<p class="eyebrow">NODE // 004</p>
<h1>SPIRITBOX</h1>

<div class="whitebox">ULTRABLACK OPERATOR</div>

<hr>

<div id="archive"></div>

<hr>

<a class="nav-link" href="../index.html">← ZERO</a>

</main>

<script src="spiritbox.js"></script>
</body>
</html>
